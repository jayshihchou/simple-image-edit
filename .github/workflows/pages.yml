name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp asset URLs with the commit so a new index.html never loads an old app.js from a cache.
      - name: Stamp version
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/__V__/$v/g" index.html js/app.js sw.js
          ! grep -rn "__V__" index.html js sw.js

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css sw.js manifest.webmanifest .nojekyll icons js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
