<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>截圖快編</title>
<meta name="description" content="貼上截圖、快速標註、複製帶走。全部在瀏覽器內處理，不上傳。">
<meta name="theme-color" content="#16181d">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v16h16M2 6h16v16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19L19 5M9 5h10v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5a2 2 0 013 3L8 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-highlight" viewBox="0 0 24 24"><path d="M9 14l-3 3v3h5l3-3M9 14l6-10 5 3-6 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-step" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9l2.5-1.5V16.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-redact" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-mosaic" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/></g></symbol>
    <symbol id="i-blur" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1"/></g></symbol>
    <symbol id="i-spotlight" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2 4h20v16H2zM8 9v6h8V9z" fill="currentColor" opacity=".55"/><rect x="8" y="9" width="8" height="6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 4h6v3H9zM9 5H6a1 1 0 00-1 1v14a1 1 0 001 1h12a1 1 0 001-1V6a1 1 0 00-1-1h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 016 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 00-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor"/><path d="M4 18l5-5 3 3 3-3 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 5V5a1 1 0 00-1-1H5a1 1 0 00-1 1v9a1 1 0 001 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 13l5 5L20 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand"><img src="icons/icon.svg" alt="" width="22" height="22"><span>截圖快編</span></div>

  <div class="group">
    <button class="btn" id="btnOpen" data-tip="開啟檔案" data-key="Ctrl O"><svg><use href="#i-open"/></svg><span class="lbl">開啟</span></button>
    <button class="btn" id="btnPaste" data-tip="從剪貼簿貼上" data-key="Ctrl V"><svg><use href="#i-paste"/></svg><span class="lbl">貼上</span></button>
    <button class="btn" id="btnCapture" data-tip="擷取螢幕或視窗"><svg><use href="#i-screen"/></svg><span class="lbl">擷取</span></button>
  </div>

  <div class="group">
    <button class="btn icon needs-doc" id="btnUndo" data-tip="復原" data-key="Ctrl Z" aria-label="復原"><svg><use href="#i-undo"/></svg></button>
    <button class="btn icon needs-doc" id="btnRedo" data-tip="重做" data-key="Ctrl Y" aria-label="重做"><svg><use href="#i-redo"/></svg></button>
  </div>

  <div class="group menu-wrap">
    <button class="btn needs-doc" id="btnImage" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-image"/></svg><span class="lbl">影像</span><svg class="chev"><use href="#i-chevron"/></svg></button>
    <div class="menu" id="menuImage" role="menu" hidden>
      <button role="menuitem" data-op="rotate-cw">向右旋轉 90°</button>
      <button role="menuitem" data-op="rotate-ccw">向左旋轉 90°</button>
      <button role="menuitem" data-op="flip-h">水平翻轉</button>
      <button role="menuitem" data-op="flip-v">垂直翻轉</button>
      <hr>
      <button role="menuitem" data-op="resize">調整尺寸…</button>
      <button role="menuitem" data-op="frame">邊框與圓角…</button>
    </div>
  </div>

  <div class="spacer"></div>

  <button class="btn icon" id="btnHelp" data-tip="快捷鍵" data-key="?" aria-label="快捷鍵"><svg><use href="#i-help"/></svg></button>

  <div class="group menu-wrap">
    <button class="btn needs-doc" id="btnDownload" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-download"/></svg><span class="lbl">下載</span><svg class="chev"><use href="#i-chevron"/></svg></button>
    <div class="menu right" id="menuDownload" role="menu" hidden>
      <button role="menuitem" data-format="image/png">PNG（無損）<kbd>Ctrl S</kbd></button>
      <button role="menuitem" data-format="image/jpeg">JPEG（檔案小）</button>
      <button role="menuitem" data-format="image/webp">WebP</button>
    </div>
  </div>

  <button class="btn primary needs-doc" id="btnCopy" data-tip="複製編輯結果" data-key="Ctrl C"><svg id="copyIcon"><use href="#i-copy"/></svg><span id="copyLabel">複製</span></button>
</header>

<div class="options" id="options">
  <div class="opt" id="optColor">
    <div class="swatches" id="swatches" role="radiogroup" aria-label="顏色"></div>
    <label class="swatch custom" data-tip="自訂顏色"><input type="color" id="colorInput" aria-label="自訂顏色"></label>
  </div>
  <label class="opt" id="optSize"><span id="sizeLabel">粗細</span><input type="range" id="sizeInput" min="1" max="30"><output id="sizeValue"></output></label>
  <label class="opt toggle" id="optFill"><input type="checkbox" id="fillInput"><span id="fillLabel">填滿</span></label>
  <div class="opt" id="optCrop">
    <div class="segmented" id="cropAspects" role="radiogroup" aria-label="裁切比例">
      <button data-aspect="" class="on">自由</button>
      <button data-aspect="1">1:1</button>
      <button data-aspect="1.3333333">4:3</button>
      <button data-aspect="1.7777778">16:9</button>
    </div>
    <output id="cropSize"></output>
    <button class="btn small accent" id="cropApply">套用</button>
    <button class="btn small" id="cropCancel">取消</button>
  </div>
  <div class="opt" id="optObject">
    <button class="btn small" id="objDup" data-tip="再製" data-key="Ctrl D">再製</button>
    <button class="btn small" id="objFront" data-tip="移到最上層" data-key="Ctrl ]">置頂</button>
    <button class="btn small" id="objBack" data-tip="移到最下層" data-key="Ctrl [">置底</button>
    <button class="btn small danger" id="objDelete" data-tip="刪除" data-key="Del">刪除</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<main class="workspace">
  <nav class="tools" id="tools" aria-label="工具"></nav>

  <div class="stage" id="stage">
    <canvas id="main"></canvas>
    <canvas id="overlay"></canvas>
    <textarea id="textEditor" spellcheck="false" hidden aria-label="文字內容"></textarea>

    <div class="empty" id="empty">
      <h1>按 <kbd id="pasteKey">Ctrl V</kbd> 貼上截圖</h1>
      <p>或把圖片拖進來。編輯完按 <kbd id="copyKey">Ctrl C</kbd>，就能貼到任何地方。</p>
      <div class="empty-actions">
        <button class="btn" id="emptyOpen"><svg><use href="#i-open"/></svg>開啟檔案</button>
        <button class="btn" id="emptyPaste"><svg><use href="#i-paste"/></svg>從剪貼簿貼上</button>
        <button class="btn" id="emptyCapture"><svg><use href="#i-screen"/></svg>擷取畫面</button>
      </div>
      <p class="privacy">影像只在你的瀏覽器裡處理，不會上傳。</p>
    </div>

    <div class="dropmask" id="dropmask" hidden><span>放開以加入影像</span></div>

    <div class="statusbar" id="statusbar" hidden>
      <span id="dims"></span>
      <div class="zoom">
        <button class="btn icon small" id="zoomOut" aria-label="縮小">−</button>
        <button class="btn small" id="zoomLabel" data-tip="切換 100% / 符合視窗" data-key="Ctrl 0">100%</button>
        <button class="btn icon small" id="zoomIn" aria-label="放大">+</button>
      </div>
    </div>
  </div>
</main>

<dialog id="dlgResize">
  <form method="dialog">
    <h2>調整尺寸</h2>
    <p class="muted">會把標註合併進影像，可用復原還原。</p>
    <div class="row">
      <label>寬 <input type="number" id="rzW" min="1" max="16000"></label>
      <label>高 <input type="number" id="rzH" min="1" max="16000"></label>
      <label class="toggle"><input type="checkbox" id="rzLock" checked><span>鎖定比例</span></label>
    </div>
    <div class="segmented" id="rzPresets">
      <button type="button" data-pct="25">25%</button>
      <button type="button" data-pct="50">50%</button>
      <button type="button" data-pct="75">75%</button>
      <button type="button" data-pct="150">150%</button>
      <button type="button" data-pct="200">200%</button>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn accent" value="ok">套用</button>
    </div>
  </form>
</dialog>

<dialog id="dlgFrame">
  <form method="dialog">
    <h2>邊框與圓角</h2>
    <p class="muted">會把標註合併進影像，可用復原還原。</p>
    <div class="stack">
      <label class="field"><span>留白</span><input type="number" id="frPad" min="0" max="1000" value="24"></label>
      <label class="field"><span>圓角</span><input type="number" id="frRadius" min="0" max="500" value="12"></label>
      <label class="field"><span>背景色</span><input type="color" id="frColor" value="#ffffff"></label>
      <label class="toggle"><input type="checkbox" id="frTransparent"><span>透明背景（僅 PNG / WebP）</span></label>
      <label class="toggle"><input type="checkbox" id="frShadow" checked><span>陰影（需要留白）</span></label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn accent" value="ok">套用</button>
    </div>
  </form>
</dialog>

<dialog id="dlgHelp">
  <form method="dialog">
    <h2>快捷鍵</h2>
    <div class="keys" id="keysTable"></div>
    <div class="dlg-actions"><button class="btn accent" value="ok">知道了</button></div>
  </form>
</dialog>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
